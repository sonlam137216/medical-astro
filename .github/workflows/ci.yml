name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
      - run: npm run check:seo

      # Browser checks drive the Chrome that is already installed on the runner (playwright-core downloads none).
      - name: Browser checks (policy violations, overflow and tap sizes, animations)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run check:csp
          npm run check:responsive
          npm run check:motion
          npm run check:font-layout

      # The build that goes live differs from the one above (indexable, with canonical addresses and a sitemap):
      # build it too, with a stand-in address, so a mistake in that switch cannot reach launch day unseen.
      - name: Launch build (SITE_URL + SITE_INDEXABLE)
        env:
          SITE_URL: https://example.com
          SITE_INDEXABLE: 'true'
        run: |
          npm run build
          npm run check:seo -- --site=https://example.com
